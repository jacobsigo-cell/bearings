name: Install Bearings vertical slice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-vertical-slice.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract vertical slice
        run: |
          unzip -o bearings-vertical-slice-github-ready.zip -x README.md

      - name: Commit extracted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install Bearings vertical slice"
          git push